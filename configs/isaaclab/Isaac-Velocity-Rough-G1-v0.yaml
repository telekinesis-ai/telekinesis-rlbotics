# Isaac-Velocity-Rough-G1-v0: https://isaac-sim.github.io/IsaacLab/main/source/overview/environments.html
#
# A starting point for this kind of task, not a measured recipe. Watch Diagnostics/kl.

env:
  framework: isaaclab
  id: Isaac-Velocity-Rough-G1-v0
  num_envs: 4096
  device: auto
  headless: true

runner:
  num_learning_iterations: 4000
  num_steps_per_env: 24
  obs_groups:
    actor: [policy]
    critic: [policy]
  verbose: true
  check_for_nan: false
  torch_compile_mode: null

  logger:
    log_dir: logs
    experiment: isaaclab_ppo
    log_interval: 10
    save_interval: 100
    keep_last_n: 5
    save_best: true
    log_video: true
    resume: null

  algorithm:
    class_name: PPO
    optimizer: adam
    learning_rate: 0.001
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    desired_kl: 0.01
    clip_param: 0.2
    entropy_coef: 0.005
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    value_loss_coef: 1.0

  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_range: [0.2, 2.0]

  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
