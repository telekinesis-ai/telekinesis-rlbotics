# Pendulum-v1: https://gymnasium.farama.org/environments/classic_control/pendulum/

env:
  framework: gymnasium
  id: Pendulum-v1
  num_envs: 8
  device: auto

runner:
  num_learning_iterations: 120
  num_steps_per_env: 128
  obs_groups:
    actor: [observation]
    critic: [observation]
  verbose: true
  check_for_nan: false
  torch_compile_mode: null

  logger:
    log_dir: logs
    experiment: gymnasium_ppo
    log_interval: 10
    save_interval: 25
    keep_last_n: 5
    save_best: true
    log_video: false
    resume: null

  algorithm:
    class_name: PPO
    optimizer: adam
    learning_rate: 0.0003
    num_learning_epochs: 10
    num_mini_batches: 4
    schedule: adaptive
    desired_kl: 0.01
    clip_param: 0.2
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    value_loss_coef: 1.0

  actor:
    class_name: MLPModel
    hidden_dims: [64, 64]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_range: [0.2, 1.5]

  critic:
    class_name: MLPModel
    hidden_dims: [64, 64]
    activation: elu
    obs_normalization: true
