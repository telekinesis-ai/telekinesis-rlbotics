[build-system]
requires = [
    "setuptools>=61",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "telekinesis-rlbotics"
version = "0.1.3"
description = "Reinforcement Learning package from Telekinesis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Telekinesis GmbH", email = "support@telekinesis.ai" },
]
maintainers = [
    { name = "Telekinesis GmbH", email = "support@telekinesis.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.5.0",
    "tensordict>=0.7.0",
    "numpy>=1.16.4",
    "tensorboard",
    "onnx",
    "onnxscript>=0.5.4",
    "loguru",
    "onnxruntime",
    "imageio[ffmpeg]",
    "pyyaml",
]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
dev = [
    "ruff==0.15.9",
    "pylint==4.0.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
]
gym = [
    "gymnasium[classic-control,mujoco]>=1.0",
]
mjlab = [
    "mjlab>=1.5",
]
isaaclab = [
    "isaaclab[isaacsim,all]>=2.3",
]


[project.urls]
Homepage = "https://docs.telekinesis.ai/"
Documentation = "https://docs.telekinesis.ai/skills/rlbotics/overview.html"
Repository = "https://github.com/telekinesis-ai/telekinesis-rlbotics"
Issues = "https://github.com/telekinesis-ai/telekinesis-rlbotics/issues"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
